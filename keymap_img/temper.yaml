layout: {zmk_keyboard: temper}
layers:
  qwertz:
  - [Q, W, E, R, T, Y, U, I, O, P]
  - - A
    - S
    - D
    - F
    - G
    - H
    - J
    - K
    - L
    - {t: ;, s: ':'}
  - - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - {t: ',', s: 'Sft+,'}
    - {t: ., s: Sft+.}
    - {t: '-', s: _}
  - - {t: ⌘, h: wm}
    - {t: ⎇, h: fn}
    - {t: ⇧, s: ⇪}
    - SPACE
    - cfg
    - BSPC
  fn:
  - [F1, F2, F3, F4, F5, KP STAR, KP 7, KP 8, KP 9, KP SLASH]
  - [F6, F7, F8, F9, F10, KP PLUS, KP 4, KP 5, KP 6, KP MINUS]
  - [F11, F12, PSCRN, HOME, END, KP EQUAL, KP 1, KP 2, KP 3, KP DOT]
  - - ↹
    - {t: ⎇, type: held}
    - ESC
    - KP 0
    - ⌃
    - RET
  wm:
  - [Ctl+↑, Ctl+↓, Gui+SPACE, Gui+↹, Ctl+Alt+↓, '&mkp MB4', '&mkp MB5', '&mmv MOVE_UP', Ctl+Alt+BSPC, '&msc SCRL_UP']
  - - Ctl+Alt+U
    - Ctl+Alt+←
    - Ctl+Alt+RET
    - Ctl+Alt+→
    - Ctl+Alt+I
    - {t: ▽, type: trans}
    - '&mmv MOVE_LEFT'
    - '&mmv MOVE_DOWN'
    - '&mmv MOVE_RIGHT'
    - '&msc SCRL_DOWN'
  - - {t: ⌘, h: sticky}
    - {t: ⎇, h: sticky}
    - {t: ⌃, h: sticky}
    - {t: ⇧, h: sticky}
    - Ctl+Alt+C
    - '&msc SCRL_LEFT'
    - ESC
    - RET
    - DEL
    - '&msc SCRL_RIGHT'
  - - {type: held}
    - ⎇
    - ⇧
    - '&mkp MB1'
    - '&mkp MB2'
    - '&mkp MB3'
  cfg:
  - - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - PSCRN
    - BRI DN
    - BRI UP
    - OUT USB
    - OUT BLE
  - [BT CLR, OUT TOG, Ctl+Gui+Q, SLEEP, CAPS, SLEEP, VOL DN, VOL UP, MUTE, APP]
  - ['&sys_reset', '&bootloader', Gui+Sft+3, Gui+Sft+4, Gui+Sft+5, STOP, PREV, PP, NEXT, EJECT]
  - - ⌘
    - ⎇
    - ⇧
    - SPACE
    - {type: held}
    - BSPC
