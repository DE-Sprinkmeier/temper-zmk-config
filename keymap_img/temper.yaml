layout: {zmk_keyboard: temper}
layers:
  qwertz:
  - [Q, W, E, R, T, Y, U, I, O, P]
  - - {t: A, h: ⇧}
    - {t: S, h: ⌃}
    - {t: D, h: ⎇}
    - {t: F, h: ⌘}
    - G
    - H
    - {t: J, h: ⌘}
    - {t: K, h: ⎇}
    - {t: L, h: ⌃}
    - {t: ;, h: ⇧, s: ':'}
  - - Z
    - X
    - C
    - V
    - B
    - N
    - M
    - {t: ',', s: ;}
    - {t: ., s: ':'}
    - '-'
  - - {t: ESC, h: wm}
    - {t: ↹, h: sym}
    - {t: ⇧, s: ⇪}
    - SPACE
    - {t: RET, h: nav}
    - {t: BSPC, h: cfg}
  sym:
  - ['!', '"', '{', '}', '|', '&', '7', '8', '9', '*']
  - ['#', '@', (, ), '=', '%', '4', '5', '6', +]
  - ['~', $, '[', ']', \, '?', '1', '2', '3', /]
  - - <
    - {type: held}
    - '>'
    - ''''
    - '0'
    - _
  nav:
  - [F1, F2, F3, F4, F5, PG UP, HOME, ↑, END, PG DN]
  - [F6, F7, F8, F9, F10, DEL, ←, ↓, →, BSPC]
  - - F11
    - F12
    - PSCRN
    - CAPS
    - ESC
    - INS
    - ↞
    - {t: ▽, type: trans}
    - ↠
    - Alt+BSPC
  - - ↹
    - ⌘
    - {t: ▽, type: trans}
    - {t: ▽, type: trans}
    - {type: held}
    - {t: ▽, type: trans}
  wm:
  - [Ctl+↑, Ctl+↓, Gui+SPACE, Gui+↹, Ctl+Alt+↓, '&mkp MB4', '&mkp MB5', '&mmv MOVE_UP', Ctl+Alt+BSPC, '&msc SCRL_UP']
  - - Ctl+Alt+U
    - Ctl+Alt+←
    - Ctl+Alt+RET
    - Ctl+Alt+→
    - Ctl+Alt+I
    - {t: ▽, type: trans}
    - '&mmv MOVE_LEFT'
    - '&mmv MOVE_DOWN'
    - '&mmv MOVE_RIGHT'
    - '&msc SCRL_DOWN'
  - - {t: ⌘, h: sticky}
    - {t: ⎇, h: sticky}
    - {t: ⌃, h: sticky}
    - {t: ⇧, h: sticky}
    - Ctl+Alt+C
    - '&msc SCRL_LEFT'
    - ESC
    - RET
    - DEL
    - '&msc SCRL_RIGHT'
  - - {type: held}
    - ⎇
    - ⇧
    - '&mkp MB1'
    - '&mkp MB2'
    - '&mkp MB3'
  cfg:
  - - {t: BT, h: '0'}
    - {t: BT, h: '1'}
    - {t: BT, h: '2'}
    - {t: BT, h: '3'}
    - {t: BT, h: '4'}
    - PSCRN
    - BRI DN
    - BRI UP
    - OUT USB
    - OUT BLE
  - [BT CLR, OUT TOG, Ctl+Gui+Q, SLEEP, CAPS, SLEEP, VOL DN, VOL UP, MUTE, APP]
  - ['&sys_reset', '&bootloader', Gui+Sft+3, Gui+Sft+4, Gui+Sft+5, STOP, PREV, PP, NEXT, EJECT]
  - - ⌘
    - ⎇
    - ⇧
    - SPACE
    - RET
    - {type: held}
